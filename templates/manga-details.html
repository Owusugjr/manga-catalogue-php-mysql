<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ manga.title }} – Manga Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet">
  </head>
  <body class="bg-light">

    {{ include('navigation.html') }}

    <div class="container my-4 pt-5">
      <h1 class="mb-4">{{ manga.title }}</h1>

      <dl class="row">
        <dt class="col-sm-3">Title</dt>
        <dd class="col-sm-9">{{ manga.title }}</dd>

        <dt class="col-sm-3">Genre</dt>
        <dd class="col-sm-9">{{ manga.genre }}</dd>

        <dt class="col-sm-3">Release Year</dt>
        <dd class="col-sm-9">{{ manga.release_year }}</dd>

        <dt class="col-sm-3">Google Rating</dt>
        <dd class="col-sm-9">{{ manga.google_rating }}</dd>

        <dt class="col-sm-3">Description</dt>
        <dd class="col-sm-9">{{ manga.description }}</dd>
      </dl>

      <div class="mt-3 d-flex gap-2">
        {% if current_user %}
          <a href="manga-edit.php?id={{ manga.id }}" class="btn btn-warning">
            Edit Manga
          </a>
        {% endif %}

        <a href="game.php" class="btn btn-secondary">
          Back to All Manga
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
