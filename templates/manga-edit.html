<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Manga DB – Edit manga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet">
  </head>
  <body class="bg-light">

    {{ include('navigation.html') }}

    <style>
      label.form-label {
        font-weight: 600;
      }
    </style>

    <div class="container my-4 pt-5">

      <div class="card mb-4">
        <div class="card-body d-flex justify-content-between align-items-center">
          <h1 class="h4 mb-0">Edit Manga</h1>
          <a href="game.php" class="btn btn-sm btn-secondary">Back to list</a>
        </div>
      </div>

      {% if success %}
        <div class="alert alert-success">
          Manga has been updated successfully.
        </div>
      {% endif %}

      {% if errors is not empty %}
        <div class="alert alert-danger">
          <ul class="mb-0">
            {% for msg in errors %}
              <li>{{ msg }}</li>
            {% endfor %}
          </ul>
        </div>
      {% endif %}

      <form action="manga-edit.php?id={{ id }}" method="post" class="row g-3 p-3">

        <div class="col-md-6">
          <label for="title" class="form-label">Title</label>
          <input
            type="text"
            name="title"
            id="title"
            class="form-control"
            value="{{ title }}"
            required>
        </div>

        <div class="col-md-6">
          <label for="genre" class="form-label">Genre</label>
          <input
            type="text"
            name="genre"
            id="genre"
            class="form-control"
            value="{{ genre }}"
            required>
        </div>

        <div class="col-md-3">
          <label for="year" class="form-label">Release Year</label>
          <input
            type="text"
            name="year"
            id="year"
            class="form-control"
            value="{{ year }}"
            required>
        </div>

        <div class="col-md-3">
          <label for="rating" class="form-label">Google Rating</label>
          <input
            type="text"
            name="rating"
            id="rating"
            class="form-control"
            value="{{ rating }}"
            required>
        </div>

        <div class="col-12">
          <label for="description" class="form-label">Description</label>
          <textarea
            name="description"
            id="description"
            rows="4"
            class="form-control">{{ description }}</textarea>
        </div>

        <div class="col-12">
          <button type="submit" class="btn btn-primary">
            Save changes
          </button>
        </div>

      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
